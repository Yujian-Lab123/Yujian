name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: yujian
          POSTGRES_USER: yujian
          POSTGRES_PASSWORD: yujian_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yujian -d yujian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://yujian:yujian_ci@localhost:5432/yujian
      TOKEN_ENCRYPTION_KEY: ci-only-not-a-production-secret
      DEMO_AUTH_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run audit:prod
