name: yujian-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: yujian
      POSTGRES_USER: yujian
      POSTGRES_PASSWORD: yujian_dev
    ports:
      - "54329:5432"
    volumes:
      - yujian_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yujian -d yujian"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  yujian_postgres_data:
